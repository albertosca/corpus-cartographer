name: Gem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The other half of the cross-check: the corpus_atlas gem's own suite, run
# against the engine built from THIS commit and against THIS commit's
# contracts, so a change here that the gem cannot read fails here and not at
# the gem's next release. The gem's repository is private until it is
# published, so the job needs a read token; without it the job FAILS rather
# than skipping, because a skipped job would read as a green one.
jobs:
  gem-suite:
    runs-on: ubuntu-latest
    env:
      GEM_REPOSITORY: albertosca/corpus-atlas
      GEM_READ_TOKEN: ${{ secrets.GEM_READ_TOKEN }}
    steps:
      - name: The read token must exist
        run: |
          if [ -z "${GEM_READ_TOKEN}" ]; then
            echo "::error::The GEM_READ_TOKEN secret is not set. Create a read-only token for ${GEM_REPOSITORY} (contents: read) and store it as that repository secret."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: engine
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine from this commit
        working-directory: engine
        run: cargo build --release --locked
      - name: Check out the gem
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GEM_REPOSITORY }}
          token: ${{ secrets.GEM_READ_TOKEN }}
          path: gem
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: gem/.ruby-version
          bundler-cache: true
          working-directory: gem
      - name: Run the gem's suite against this engine and these contracts
        working-directory: gem
        env:
          CORPUS_ENGINE_BIN: ${{ github.workspace }}/engine/target/release/corpus-cartographer
          ENGINE_CONTRACTS_DIR: ${{ github.workspace }}/engine/contracts
        run: bin/rails test
