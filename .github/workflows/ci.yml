name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
  # Line coverage of src/ with a floor; the README badge shows the measured
  # number and is updated by hand when it changes.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --locked --summary-only --fail-under-lines 98
  # The oldest Rust the engine builds and passes its suite on: the
  # `rust-version` in Cargo.toml, so that number is measured, not declared.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 test --locked
  # The arXiv demo converter's refusals (standard library only, like the script).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B -m unittest discover -s scripts
