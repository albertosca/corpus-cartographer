[package]
name = "corpus-cartographer"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Lays out a corpus map and finds links between items"
license = "MIT"
repository = "https://github.com/albertosca/corpus-cartographer"

[dependencies]
clap = { version = "4", features = ["derive"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[dev-dependencies]
jsonschema = "0.59"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
strip = true
